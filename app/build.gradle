apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'androidx.navigation.safeargs.kotlin'

android {
    namespace 'com.example.help_code'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    compileSdk 36

    defaultConfig {
        applicationId "com.example.help_code"
        minSdk 26
        targetSdk 35

        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.0"

    def coroutineVersion = "1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutineVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutineVersion"

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.google.android.material:material:1.12.0'

    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.recyclerview:recyclerview-selection:1.2.0-alpha01"

    def nav_version = "2.7.7"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    def lifecycle_version = "2.8.4"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    implementation 'com.intuit.sdp:sdp-android:1.1.1'

    def camerax_version = "1.5.2"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    def mediaVersion = "1.6.0"
    implementation "androidx.media3:media3-exoplayer:$mediaVersion"
    implementation "androidx.media3:media3-ui:$mediaVersion"
    implementation "androidx.media3:media3-exoplayer-dash:$mediaVersion"

    implementation "com.github.skydoves:balloon:1.5.4"
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation "androidx.biometric:biometric-ktx:1.2.0-alpha05"
    implementation 'jp.wasabeef:recyclerview-animators:4.0.2'

    def retrofitVersion = "2.11.0"
    implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"
    implementation "com.squareup.retrofit2:adapter-rxjava2:$retrofitVersion"
    implementation "com.squareup.retrofit2:converter-gson:$retrofitVersion"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Firebase
     implementation platform('com.google.firebase:firebase-bom:34.6.0')
     implementation 'com.google.firebase:firebase-analytics'
     implementation 'com.google.firebase:firebase-auth'

    // Google Play Services Auth
     implementation 'com.google.android.gms:play-services-auth:21.2.0'

    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    implementation 'io.michaelrocks:libphonenumber-android:8.13.28'

    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.13.1"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.13.1"
    implementation 'javax.xml.stream:stax-api:1.0-2'

    // For the Google Play services code scanner
    implementation ("com.google.android.gms:play-services-code-scanner:16.1.0")
    // The crucial ML Kit vision bridge
    implementation("androidx.camera:camera-mlkit-vision:1.3.0")
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    implementation "org.apache.poi:poi-ooxml:5.2.5"
    implementation "org.zeroturnaround:zt-zip:1.17"

    // Credential Manager main library
    implementation("androidx.credentials:credentials:1.3.0")

    // Play services auth support for Credential Manager
    implementation("androidx.credentials:credentials-play-services-auth:1.3.0")

    // Google ID support (optional, for specific token handling)
    implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")
}